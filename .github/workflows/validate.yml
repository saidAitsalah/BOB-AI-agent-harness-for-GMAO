name: BorneFlow Validation

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
      - name: Compile
        run: mvn compile
      - name: Test
        run: mvn test
      - name: Check conventions
        run: |
          # Vérifie qu'il n'y a pas de System.out.println
          grep -r "System.out.println" src/ && exit 1 || echo "OK"
          # Vérifie qu'il n'y a pas de catch vide
          grep -rn "catch.*{[[:space:]]*}" src/ && exit 1 || echo "OK"