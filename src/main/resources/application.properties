# ============================================================================
# Configuration de l'application BorneFlow
# ============================================================================

# Métadonnées
borneflow.app.name=BorneFlow
borneflow.app.version=1.0.0-SNAPSHOT
borneflow.app.environment=dev

# Base de données (H2 en mémoire pour le POC)
borneflow.db.url=jdbc:h2:mem:borneflow;DB_CLOSE_DELAY=-1
borneflow.db.driver=org.h2.Driver
borneflow.db.username=sa
borneflow.db.password=REDACTED_PASSWORD
borneflow.integration.api.token=sk_live_REDACTED

# Notifications (placeholder)
borneflow.notifications.enabled=true
borneflow.notifications.smtp.host=smtp.example.invalid
borneflow.notifications.smtp.port=587

# Journalisation
borneflow.logging.audit.enabled=true
